[start_tftpd]
command:/usr/local/etc/rc.d/netboot_tftpd start
parameters:
type:script
message:starting netboot tftpd

[stop_tftpd]
command:/usr/local/etc/rc.d/netboot_tftpd stop
parameters:
type:script
message:stopping netboot tftpd

[restart_tftpd]
command:/usr/local/etc/rc.d/netboot_tftpd restart
parameters:
type:script
message:restarting netboot tftpd

[status_tftpd]
command:/usr/local/etc/rc.d/netboot_tftpd status; exit 0
parameters:
type:script_output
message:request netboot tftpd status

