[setup]
command:/usr/local/opnsense/scripts/netboot/setup.sh
parameters:
type:script_output
message:ensuring netboot runtime user and directories

# NOTE: there is no [bootstrap] or [fetch_url] action here. Both used to
# exist as shell scripts launched through configd, but they were removed
# in favor of doing the HTTPS fetch in PHP directly via
# mvc/app/library/OPNsense/Netboot/HttpFetcher.php. The drivers:
#
#   - configd's script_output mechanism silently drops stdout when the
#     subprocess exits non-zero (returns the 'Execute error' sentinel,
#     which the PHP client strips to empty). That makes real per-fetch
#     error reporting impossible.
#
#   - The shell path was four parsers deep (PHP escapeshellarg -> configd
#     shlex -> subprocess shell -> fetch(1)), each parser its own bug
#     class. The PHP libcurl path is a single C-string argument with no
#     shell anywhere.
#
# Privilege-elevation reason that USED to require configd here is now
# handled at directory-setup time: setup.sh makes /var/netboot mode
# 02775 group _netboot owner www, so the webGUI (running as www) can
# write directly. Daemons keep their accustomed read access through
# the _netboot group + setgid inheritance. See setup.sh for details.
