{#-
  Dedicated sshd config for SFTP-only ingress to the os-netboot content root.
  Separate from OPNsense's management sshd. SFTP subsystem only -- no shell,
  no port forwarding, no PTY, chrooted, key-based auth only.

  Rendered to /var/etc/netboot/sshd-netboot.conf by `configctl template reload`.
  Authorized keys are templated separately into /var/db/netboot/authorized_keys
  by the configd 'reload' action.
-#}
Port {{ OPNsense.netboot.sftp.port | default('2069') }}
ListenAddress 0.0.0.0
ListenAddress ::
Protocol 2

# Host keys: generated on first start by the rc.d wrapper.
HostKey /var/db/netboot/ssh_host_ed25519_key
HostKey /var/db/netboot/ssh_host_rsa_key

# PID is sshd's own pidfile (no daemon(8) wrapping).
PidFile /var/run/netboot_sftp.pid

# Logging
SyslogFacility AUTH
LogLevel INFO

# Authentication: keys only, no root, no passwords.
PermitRootLogin no
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
UsePAM no
AuthenticationMethods publickey
StrictModes yes

# Only the _netboot service user is allowed.
AllowUsers _netboot

# Authorized keys live in a known location templated from the model.
AuthorizedKeysFile /var/db/netboot/authorized_keys

# SFTP subsystem only -- ForceCommand below ensures no shell sessions.
Subsystem sftp internal-sftp

Match User _netboot
    ChrootDirectory {{ OPNsense.netboot.general.content_root | default('/var/netboot') }}
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    AllowAgentForwarding no
    GatewayPorts no
