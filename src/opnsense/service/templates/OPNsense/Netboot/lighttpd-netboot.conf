{#-
  Dedicated lighttpd instance for the os-netboot HTTP server. Serves the
  same content root that TFTP serves, on a separate port from the OPNsense
  management webGUI. Read-only: no PUT/DELETE, no PHP/CGI, no auth.

  Rendered by `configctl template reload OPNsense/Netboot`.
-#}
server.modules = (
    "mod_dirlisting",
    "mod_indexfile",
)

server.document-root = "{{ OPNsense.netboot.general.content_root | default('/var/netboot') }}"
server.port          = {{ OPNsense.netboot.general.http_port | default('8069') }}
server.bind          = "0.0.0.0"
server.use-ipv6      = "enable"
server.username      = "_netboot"
server.groupname     = "_netboot"

server.pid-file      = "/var/run/netboot_http.pid"
server.errorlog      = "/var/log/netboot/http_error.log"

# Directory listings on -- iPXE and admins discover what's available.
dir-listing.activate = "enable"
dir-listing.hide-dotfiles = "enable"

# Index files iPXE menus typically look for.
index-file.names = ( "index.html", "menu.ipxe", "boot.ipxe" )

# MIME types relevant to netboot payloads. lighttpd's defaults are
# HTML-centric; we add the ones our use case actually needs.
mimetype.assign = (
    ".html"  => "text/html",
    ".txt"   => "text/plain",
    ".ipxe"  => "text/plain",
    ".cfg"   => "text/plain",
    ".png"   => "image/png",
    ".jpg"   => "image/jpeg",
    ".iso"   => "application/octet-stream",
    ".img"   => "application/octet-stream",
    ".efi"   => "application/octet-stream",
    ".kpxe"  => "application/octet-stream",
    ".0"     => "application/octet-stream",
    ".bin"   => "application/octet-stream",
    ""       => "application/octet-stream",
)

# Allow large file ranges for ISO downloads.
server.range-requests = "enable"
